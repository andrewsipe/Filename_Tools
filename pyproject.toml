[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filenametools"
version = "0.5.0"
description = "Clean, normalize and reorder terms in font filenames"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Andrew Sipe" }
]
license = { text = "MIT" }
dependencies = [
    "fonttools>=4.40.0",
    "rich>=13.0.0",
    "word2number>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/andrewsipe/Filename_Tools"
Repository = "https://github.com/andrewsipe/Filename_Tools"

[project.scripts]
filenametools = "filenametools.cli:main"

[tool.setuptools]
packages = ["filenametools", "FontCore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.fontcore-vendor]
modules = ["core_console_styles", "core_file_collector", "core_font_style_dictionaries"]
